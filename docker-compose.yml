services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koko}
      POSTGRES_USER: ${POSTGRES_USER:-koko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # порты сдвинуты, чтобы не мешать Падаче (5432/8000/5173) на той же машине
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - db
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5180:5180"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
